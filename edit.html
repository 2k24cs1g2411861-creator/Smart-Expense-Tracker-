{% extends "base.html" %}{% block title %}Edit expense · Expense Tracker{% endblock %}
{% block content %}<section class="panel"><h1>Edit expense</h1><form method="post">
<label>Amount (₹)<input type="number" name="amount" min="0.01" step="0.01" value="{{ expense.amount }}" required></label>
<label>Category<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if category.id == expense.category_id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label>
<label>Date<input type="date" name="expense_date" value="{{ expense.expense_date }}" required></label>
<label>Note<input name="note" maxlength="200" value="{{ expense.note }}"></label><button>Save changes</button></form><p><a href="{{ url_for('dashboard') }}">Cancel</a></p></section>{% endblock %}
